name: V2 Validation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/**"
      - "docs/**"
      - "assets/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "tests/**"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/**"
      - "docs/**"
      - "assets/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "tests/**"
  workflow_dispatch:

concurrency:
  group: profile-v2-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m py_compile .github/scripts/*.py scripts/*.py tests/*.py

      - name: Run V2 unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate the compact public README and archive contract
        run: python scripts/validate_compact_readme.py

      # A geração detalhada, os badges, CTAs e identidade visual são validados
      # pelo Rust Core E2E sobre uma cópia gerada pelo Python e pelo Rust.

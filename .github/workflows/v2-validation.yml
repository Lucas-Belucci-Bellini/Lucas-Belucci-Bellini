name: V2 Validation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/**"
      - "docs/**"
      - "assets/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "tests/**"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/**"
      - "docs/**"
      - "assets/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "tests/**"
  workflow_dispatch:

concurrency:
  group: profile-v2-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m py_compile .github/scripts/*.py scripts/*.py tests/*.py

      - name: Run V2 unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate generated language badges and Arsenal categories
        run: python scripts/validate_language_badges.py

      - name: Validate the showcase CTA rule (site first, code second)
        run: python scripts/validate_project_links.py

      # Banner, títulos animados, ícones, cards locais, snake, contador:
      # a identidade visual do README não some num PR sem ninguém ver.
      - name: Validate the preserved visual identity of the README
        run: python scripts/validate_restored_style.py

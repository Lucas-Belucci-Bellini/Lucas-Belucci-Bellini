name: Análise de Linguagens (bot)

on:
  schedule:
    # De hora em hora (UTC). O GitHub pode atrasar agendamentos em horários de pico.
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/*.py"
      - ".github/workflows/lang-stats.yml"
  # Em PR o job roda só o TESTE e para aí (ver o `if:` do passo de análise).
  # Sem isto, mexer no bot não produzia sinal nenhum antes do merge: o erro só
  # apareceria na execução horária, já no `main`, publicando número errado ou
  # deixando o README parado sem ninguém notar.
  pull_request:
    paths:
      - ".github/scripts/*.py"
      - ".github/workflows/lang-stats.yml"

# Nunca deixa duas execuções mexerem no README ao mesmo tempo.
concurrency:
  group: lang-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Roda ANTES da análise. Este bot escreve direto no README público do
      # perfil, e não há como conferir o resultado antes de publicar — um erro
      # aqui não quebra nada, só imprime um número errado com a mesma
      # confiança de um certo. O teste alimenta o bot com respostas de API
      # fabricadas e cobra que cada número diga o que o rótulo promete.
      - name: Provar o bot contra respostas de API fabricadas
        run: python3 .github/scripts/testar_lang_stats.py

      # Em PR para aqui: analisar exigiria o PAT (que não vai para fork) e o
      # passo seguinte ESCREVE no README e faz commit — coisa de `main`, não
      # de revisão.
      - name: Analisar linguagens e arquivos de todos os repositórios
        if: github.event_name != 'pull_request'
        env:
          # LANG_STATS_TOKEN é um PAT com escopo `repo` — é o que permite ver
          # repositório PRIVADO. Sem ele o passo continua funcionando, só que
          # cobrindo apenas os públicos, e o relatório diz isso em vez de
          # apresentar número incompleto como se fosse total.
          #
          # ATENÇÃO: com o PAT presente, o nome dos repositórios privados passa
          # a aparecer neste README, que é PÚBLICO. Para manter os números e
          # esconder os nomes, ligue OCULTAR_NOMES_PRIVADOS abaixo.
          GITHUB_TOKEN: ${{ secrets.LANG_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          INCLUDE_FORKS: "0"
          OCULTAR_NOMES_PRIVADOS: "0"
        run: python3 .github/scripts/lang_stats.py

      - name: Commitar se houver mudança
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/lang-stats.svg
          if git diff --cached --quiet; then
            echo "Nada mudou — sem commit."
            exit 0
          fi
          git commit -m "chore(bot): atualiza análise de linguagens do perfil [skip ci]"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "push falhou; refazendo em cima do remoto (tentativa $i)"
            git pull --rebase --autostash origin main || true
            sleep $((2 ** i))
          done
          echo "::error::não consegui enviar o commit após 4 tentativas"
          exit 1

name: Análise de Linguagens (bot)

on:
  # Estatística de perfil não precisa rodar de hora em hora. Uma rodada semanal
  # reduz ruído no histórico e deixa a máquina de acompanhamento de commits
  # cuidar do monitoramento diário do ecossistema.
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/lang_stats.py"
      - ".github/scripts/profile_cards.py"
      - ".github/workflows/lang-stats.yml"

concurrency:
  group: lang-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analisar linguagens e arquivos de todos os repositórios públicos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          INCLUDE_FORKS: "0"
          OCULTAR_NOMES_PRIVADOS: "1"
        run: |
          python3 .github/scripts/lang_stats.py
          python3 .github/scripts/profile_cards.py

      - name: Commitar se houver mudança real
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/lang-stats.svg assets/profile-top-langs.svg assets/profile-stats.svg assets/profile-streak.svg assets/profile-trophies.svg assets/profile-projects.svg
          if git diff --cached --quiet; then
            echo "Nada mudou — sem commit."
            exit 0
          fi
          git commit -m "chore(bot): atualiza análise de linguagens do perfil [skip ci]"
          git push

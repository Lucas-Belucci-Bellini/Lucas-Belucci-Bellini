name: Portfolio website — build and validate

on:
  pull_request:
    branches:
      - main
      - feat/profile-readme-website-v2
      - feat/profile-v2-consolidated
    paths:
      - "README.md"
      - "index.html"
      - "assets/**"
      - "frontend/**"
      - "crates/profile-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tsconfig.json"
      - "vercel.json"
      - "docs/project-catalog.json"
      - "docs/PROFILE-ARCHIVE.md"
      - "docs/README_STACK.json"
      - "scripts/build_portfolio.py"
      - ".github/workflows/deploy-portfolio.yml"
      - "docs/V2-GITHUB-PAGES-DEPLOYMENT.md"
  push:
    branches:
      - main
      - feat/profile-readme-website-v2
    paths:
      - "frontend/**"
      - "crates/profile-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tsconfig.json"
      - "vercel.json"
      - "README.md"
      - "index.html"
      - "assets/**"
      - "docs/project-catalog.json"
      - "docs/PROFILE-ARCHIVE.md"
      - "docs/README_STACK.json"
      - "scripts/build_portfolio.py"
      - ".github/workflows/deploy-portfolio.yml"
      - "docs/V2-GITHUB-PAGES-DEPLOYMENT.md"
  workflow_dispatch:

concurrency:
  group: portfolio-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Type-check TypeScript frontend
        run: npx --yes --package typescript@5.9.3 tsc --noEmit -p tsconfig.json

      - name: Test public feed privacy guards
        run: npx --yes --package tsx@4.20.6 tsx --test frontend/contracts.test.ts

      - name: Compile TypeScript modules for the static site
        run: npx --yes --package typescript@5.9.3 tsc -p tsconfig.json

      - name: Install pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: portfolio-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            portfolio-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Validate source and catalog
        run: |
          python -m py_compile scripts/build_portfolio.py
          python -m json.tool docs/project-catalog.json >/dev/null
          python -m json.tool docs/README_STACK.json >/dev/null
          python scripts/validate_compact_readme.py
          test -s README.md
          test -s docs/PROFILE-ARCHIVE.md
          test -s index.html
          test -s assets/site.css
          test -s assets/site.js
          test -s frontend/main.ts
          test -s assets/favicon.svg

      - name: Run static build contract tests
        run: python -m unittest discover -s tests -p "test_build_portfolio.py" -v

      - name: Build Python reference feeds
        run: python scripts/build_portfolio.py --out /tmp/portfolio-python-dist

      - name: Check Rust formatting and site-feed tests
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p profile-core site_feed

      - name: Build public-only static artifact with Rust
        run: |
          cargo build --locked --release -p profile-core
          target/release/profile-core site build --root . --out-dir dist --frontend-build frontend/build

      - name: Compare Rust feeds with the Python reference
        run: |
          cmp /tmp/portfolio-python-dist/data/projects.json dist/data/projects.json
          cmp /tmp/portfolio-python-dist/data/stack-inventory.json dist/data/stack-inventory.json

      - name: Verify exact artifact allowlist and public data contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path("dist")
          allowed_files = {
              "index.html",
              "assets/site.css",
              "assets/main.js",
              "assets/contracts.js",
              "assets/favicon.svg",
              "data/projects.json",
              "data/stack-inventory.json",
              ".nojekyll",
          }
          actual_files = {
              p.relative_to(root).as_posix()
              for p in root.rglob("*")
              if p.is_file()
          }
          if actual_files != allowed_files:
              raise SystemExit(
                  "Artifact allowlist mismatch: "
                  f"missing={sorted(allowed_files - actual_files)}, "
                  f"unexpected={sorted(actual_files - allowed_files)}"
              )

          payload = json.loads((root / "data/projects.json").read_text(encoding="utf-8"))
          projects = payload.get("projects")
          if not isinstance(projects, list) or not projects:
              raise SystemExit("Public project catalog is empty or invalid")
          if payload.get("project_count") != len(projects):
              raise SystemExit("project_count does not match projects array")

          allowed_fields = {
              "name", "slug", "description", "category", "category_label",
              "status", "github", "website",
          }
          for index, project in enumerate(projects):
              if not isinstance(project, dict):
                  raise SystemExit(f"Project at index {index} is not an object")
              unexpected_fields = set(project) - allowed_fields
              if unexpected_fields:
                  raise SystemExit(
                      f"Project at index {index} contains non-public fields: "
                      f"{sorted(unexpected_fields)}"
                  )
              github = project.get("github")
              parsed_github = urlparse(github) if isinstance(github, str) else None
              if not parsed_github or parsed_github.scheme != "https" or (parsed_github.hostname or "").lower() not in {"github.com", "www.github.com"}:
                  raise SystemExit(f"Project at index {index} has an invalid GitHub URL")
              website = project.get("website")
              if website is not None:
                  parsed_website = urlparse(website) if isinstance(website, str) else None
                  if not parsed_website or parsed_website.scheme != "https" or not parsed_website.netloc:
                      raise SystemExit(f"Project at index {index} has an invalid website URL")

          stack_path = root / "data/stack-inventory.json"
          stack = json.loads(stack_path.read_text(encoding="utf-8"))
          if stack.get("schema") != "lucas-belucci-bellini/professional-stack@1":
              raise SystemExit("Professional stack schema is invalid")
          languages = stack.get("languages")
          tools = stack.get("tools")
          summary = stack.get("summary")
          if not isinstance(languages, list) or not isinstance(tools, list) or not isinstance(summary, dict):
              raise SystemExit("Professional stack feed is malformed")
          if summary.get("language_count") != len(languages):
              raise SystemExit("Stack language_count does not match languages array")
          private_names = {
              str(item.get("name", "")).strip().casefold()
              for item in json.loads(Path("docs/project-catalog.json").read_text(encoding="utf-8")).get("projects", [])
              if isinstance(item, dict) and item.get("private") is True and str(item.get("name", "")).strip()
          }
          stack_text = stack_path.read_text(encoding="utf-8").casefold()
          leaked = sorted(name for name in private_names if name in stack_text)
          if leaked:
              raise SystemExit(f"Private project names leaked into stack feed: {leaked}")
          for index, tool in enumerate(tools):
              if not isinstance(tool, dict) or set(tool) != {"name", "category", "family", "evidence", "projects"}:
                  raise SystemExit(f"Tool at index {index} violates the public allowlist")
              if not isinstance(tool["projects"], list):
                  raise SystemExit(f"Tool at index {index} has an invalid projects list")
              for project in tool["projects"]:
                  if not isinstance(project, dict) or set(project) - {"name", "github", "website"}:
                      raise SystemExit(f"Tool evidence at index {index} contains non-public fields")

          print(f"Artifact privacy contract passed: {len(projects)} public projects")
          PY

      - name: Upload inspectable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 7


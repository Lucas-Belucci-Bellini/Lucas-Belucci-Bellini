name: Refresh profile README

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_profile.py"
      - "scripts/project_catalog.py"
      - "scripts/validate_project_links.py"
      - "docs/README_SITES.json"
      - "docs/README_FEATURED.json"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

# Um refresh por vez; o seguinte espera em vez de cancelar o que está rodando.
concurrency:
  group: update-profile
  cancel-in-progress: false

env:
  PROFILE_GITHUB_TOKEN: ${{ secrets.PROFILE_README_TOKEN }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  refresh:
    name: Audit repositories and refresh generated profile sections
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot README before refresh
        run: cp README.md /tmp/README.before.md

      - name: Refresh README and generated assets
        if: ${{ env.PROFILE_GITHUB_TOKEN != '' }}
        run: python3 scripts/update_profile.py --write

      - name: Skip refresh when private-aware inventory is unavailable
        if: ${{ env.PROFILE_GITHUB_TOKEN == '' }}
        run: echo "::warning::PROFILE_README_TOKEN is not configured; refresh skipped, README preserved. The job will fail at the end so this is not mistaken for success."

      - name: Run the profile test suite
        run: python3 -m unittest discover -s tests

      - name: Validate generated Markdown and configuration
        run: |
          python3 -m py_compile scripts/update_profile.py scripts/project_catalog.py scripts/check_websites.py scripts/validate_dynamic_sections.py scripts/validate_exclusions.py scripts/validate_project_links.py
          python3 scripts/validate_dynamic_sections.py --before /tmp/README.before.md --after README.md
          python3 scripts/validate_exclusions.py
          python3 scripts/validate_project_links.py
          python3 -m json.tool docs/README_SITES.json >/dev/null
          python3 -m json.tool docs/README_FEATURED.json >/dev/null
          python3 -m json.tool docs/README_STACK.json >/dev/null
          python3 -m json.tool docs/README_EXCLUDED.json >/dev/null
          python3 -m json.tool docs/project-catalog.json >/dev/null
          test -s README.md
          test -s assets/lang-stats.svg
          test -s assets/profile-snapshot.svg
          test -s docs/project-catalog.json
          # Os 13 blocos gerados (antes faltavam FEATURED-PROJECTS, PUBLIC-PROJECTS e PRIVATE-PROJECTS).
          for marker in PROFILE-DASHBOARD WHAT-I-BUILD PRODUCT-CARDS FEATURED-PROJECTS \
                        WEBSITE-DIRECTORY LIVE-PROJECTS ECOSYSTEM-MAP PROJECT-MAP \
                        LANGUAGE-BADGES ARSENAL-STACK LANGUAGE-STATS PUBLIC-PROJECTS PRIVATE-PROJECTS; do
            grep -q "<!-- ${marker}:START -->" README.md && grep -q "<!-- ${marker}:END -->" README.md \
              || { echo "::error::marcador ausente no README: ${marker}"; exit 1; }
          done

      - name: Commit only real changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md assets/profile-snapshot.svg docs/project-catalog.json; then
            echo "No generated changes detected."
            exit 0
          fi
          git add README.md assets/profile-snapshot.svg docs/project-catalog.json
          git commit -m "chore(profile): refresh repository catalog"
          bash .github/scripts/push_with_rebase.sh

      # Verde que não fez nada é o pior estado possível (auditoria, A1): sem o
      # token, os testes e validações acima rodam, mas o job termina vermelho.
      - name: Fail when the refresh was skipped
        if: ${{ env.PROFILE_GITHUB_TOKEN == '' }}
        run: |
          echo "::error::PROFILE_README_TOKEN is not configured: the README was NOT refreshed. Add a fine-grained PAT (Metadata: read) as the repository secret PROFILE_README_TOKEN."
          exit 1

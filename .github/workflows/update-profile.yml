name: Refresh profile README

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_profile.py"
      - "scripts/project_catalog.py"
      - "scripts/validate_project_links.py"
      - "docs/README_SITES.json"
      - "docs/README_FEATURED.json"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

env:
  PROFILE_GITHUB_TOKEN: ${{ secrets.PROFILE_README_TOKEN }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  refresh:
    name: Audit repositories and refresh generated profile sections
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Snapshot README before refresh
        run: cp README.md /tmp/README.before.md

      - name: Refresh README and generated assets
        if: ${{ env.PROFILE_GITHUB_TOKEN != '' }}
        run: python3 scripts/update_profile.py --write

      - name: Skip refresh when private-aware inventory is unavailable
        if: ${{ env.PROFILE_GITHUB_TOKEN == '' }}
        run: echo "PROFILE_README_TOKEN is not configured; preserving the private-aware catalog."

      - name: Run the profile test suite
        run: python3 -m unittest discover -s tests

      - name: Validate generated Markdown and configuration
        run: |
          python3 -m py_compile scripts/update_profile.py scripts/project_catalog.py scripts/check_websites.py scripts/validate_dynamic_sections.py scripts/validate_exclusions.py scripts/validate_project_links.py
          python3 scripts/validate_dynamic_sections.py --before /tmp/README.before.md --after README.md
          python3 scripts/validate_exclusions.py
          python3 scripts/validate_project_links.py
          python3 -m json.tool docs/README_SITES.json >/dev/null
          python3 -m json.tool docs/README_FEATURED.json >/dev/null
          python3 -m json.tool docs/README_STACK.json >/dev/null
          python3 -m json.tool docs/README_EXCLUDED.json >/dev/null
          python3 -m json.tool docs/project-catalog.json >/dev/null
          test -s README.md
          test -s assets/lang-stats.svg
          test -s assets/profile-snapshot.svg
          test -s docs/project-catalog.json
          grep -q '<!-- PROFILE-DASHBOARD:START -->' README.md
          grep -q '<!-- PROFILE-DASHBOARD:END -->' README.md
          grep -q '<!-- WHAT-I-BUILD:START -->' README.md
          grep -q '<!-- WHAT-I-BUILD:END -->' README.md
          grep -q '<!-- WEBSITE-DIRECTORY:START -->' README.md
          grep -q '<!-- WEBSITE-DIRECTORY:END -->' README.md
          grep -q '<!-- ARSENAL-STACK:START -->' README.md
          grep -q '<!-- ARSENAL-STACK:END -->' README.md
          grep -q '<!-- LANGUAGE-BADGES:START -->' README.md
          grep -q '<!-- LANGUAGE-BADGES:END -->' README.md
          grep -q '<!-- PROJECT-MAP:START -->' README.md
          grep -q '<!-- PROJECT-MAP:END -->' README.md
          grep -q '<!-- LANGUAGE-STATS:START -->' README.md
          grep -q '<!-- LANGUAGE-STATS:END -->' README.md
          grep -q '<!-- LIVE-PROJECTS:START -->' README.md
          grep -q '<!-- LIVE-PROJECTS:END -->' README.md
          grep -q '<!-- PRODUCT-CARDS:START -->' README.md
          grep -q '<!-- PRODUCT-CARDS:END -->' README.md
          grep -q '<!-- ECOSYSTEM-MAP:START -->' README.md
          grep -q '<!-- ECOSYSTEM-MAP:END -->' README.md

      - name: Commit only real changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md assets/lang-stats.svg assets/profile-snapshot.svg docs/project-catalog.json; then
            echo "No generated changes detected."
            exit 0
          fi
          git add README.md assets/lang-stats.svg assets/profile-snapshot.svg docs/project-catalog.json
          git commit -m "chore(profile): refresh repository catalog"
          git push

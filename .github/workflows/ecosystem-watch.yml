name: Monitor do Ecossistema

on:
  # Uma varredura por hora mantém o índice vivo sem transformar cada commit
  # dos projetos em um commit separado no perfil.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/ecosystem_watch.py"
      - ".github/workflows/ecosystem-watch.yml"

concurrency:
  group: ecosystem-watch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar commits dos repositórios públicos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          PROFILE_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: python3 .github/scripts/ecosystem_watch.py

      - name: Commitar o snapshot horário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ECOSYSTEM-COMMIT-STATE.json docs/ECOSYSTEM-COMMIT-MONITOR.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de arquivos monitorados."
            exit 0
          fi
          git commit -m "chore(bot): snapshot horário do ecossistema [skip ci]"
          git push

name: Portfolio Build

on:
  pull_request:
    branches:
      - feat/profile-readme-website-v2
    paths:
      - "index.html"
      - "assets/**"
      - "docs/project-catalog.json"
      - "scripts/build_portfolio.py"
      - ".github/workflows/portfolio-build.yml"
      - "docs/V2-GITHUB-PAGES-DEPLOYMENT.md"
  push:
    branches:
      - feat/profile-readme-website-v2
    paths:
      - "index.html"
      - "assets/**"
      - "docs/project-catalog.json"
      - "scripts/build_portfolio.py"
      - ".github/workflows/portfolio-build.yml"
      - "docs/V2-GITHUB-PAGES-DEPLOYMENT.md"
  workflow_dispatch:

concurrency:
  group: portfolio-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source files
        run: |
          python -m py_compile scripts/build_portfolio.py
          python -m json.tool docs/project-catalog.json > /dev/null
          test -s index.html
          test -s assets/site.css
          test -s assets/site.js
          test -s assets/favicon.svg

      - name: Build public-only static artifact
        run: python scripts/build_portfolio.py

      - name: Verify artifact allowlist
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/assets/site.css
          test -s dist/assets/site.js
          test -s dist/assets/favicon.svg
          test -s dist/data/projects.json
          test -f dist/.nojekyll
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("dist")
          allowed = {
              "index.html",
              "assets/site.css",
              "assets/site.js",
              "assets/favicon.svg",
              "data/projects.json",
              ".nojekyll",
          }
          actual = {
              p.relative_to(root).as_posix()
              for p in root.rglob("*")
              if p.is_file()
          }
          unexpected = actual - allowed
          missing = allowed - actual
          if unexpected or missing:
              raise SystemExit(
                  f"Artifact allowlist mismatch; unexpected={sorted(unexpected)}, "
                  f"missing={sorted(missing)}"
              )

          payload = json.loads((root / "data/projects.json").read_text(encoding="utf-8"))
          projects = payload.get("projects")
          if not isinstance(projects, list) or not projects:
              raise SystemExit("Artifact catalog is empty or invalid")
          if any(not isinstance(p, dict) for p in projects):
              raise SystemExit("Artifact catalog contains a non-object project")
          if any(p.get("private") is True for p in projects):
              raise SystemExit("Private project metadata found in artifact")
          print(f"Artifact allowlist passed: {len(projects)} public projects")
          PY

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 7

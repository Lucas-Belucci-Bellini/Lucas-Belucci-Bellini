[package]
name = "site-monitor"
description = "Verificação HTTP de sites com a semântica do urllib do Python 3.12: redirecionamentos, limites de laço e final_url idênticos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
ecosystem-domain.workspace = true
idna = "1"
regex.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt-multi-thread"] }

[lints]
workspace = true
